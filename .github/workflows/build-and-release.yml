name: Build and Release

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Build and validate artifacts without publishing a release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: build-and-release
  cancel-in-progress: false

env:
  DMG_URL: https://persistent.oaistatic.com/codex-app-prod/Codex.dmg
  UPSTREAM_REPO: https://github.com/ilysenko/codex-desktop-linux.git

jobs:
  # Cheap gate: plain runner, ~30s. The expensive Fedora container builds only
  # run when the upstream DMG fingerprint differs from the latest release.
  check:
    runs-on: [self-hosted, linux, x64, codex-desktop]
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      fingerprint: ${{ steps.compare.outputs.fingerprint }}
    steps:
      - name: Fingerprint upstream DMG and compare with latest release
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fp="$(curl -fsSLI --max-time 30 "$DMG_URL" \
            | awk 'tolower($0) ~ /^(etag|last-modified|content-length):/ {sub(/\r$/,""); print tolower($0)}' \
            | sort | sha256sum | cut -d' ' -f1)"
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"

          last_fp="$(gh release view --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null \
            | grep -oE 'fingerprint: [0-9a-f]{64}' | awk '{print $2}' || true)"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$last_fp" != "$fp" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream changed (or manual run): building. fp=$fp last=$last_fp"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream unchanged (fp=$fp)"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Retain the project runner for the existing x86_64 package.
          - runner_labels: '["self-hosted", "linux", "x64", "codex-desktop"]'
            rpm_arch: x86_64
            container_platform: linux/amd64
            container_engine: podman
            workspace_mount: ':Z'
          # GitHub-hosted Arm runners build the native aarch64 RPM. This avoids
          # relying on mutable host binfmt/QEMU registration on the x64 runner.
          - runner_labels: '["ubuntu-24.04-arm"]'
            rpm_arch: aarch64
            container_platform: linux/arm64
            container_engine: docker
            workspace_mount: ''
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    timeout-minutes: 180
    steps:
      # Run a Fedora container explicitly: the retained x64 runner uses rootless
      # Podman, while GitHub's hosted ARM runner supplies Docker.
      - name: Build RPM in Fedora container
        run: |
          set -euo pipefail
          ${{ matrix.container_engine }} run --rm --platform "${{ matrix.container_platform }}" \
            -e HOME=/tmp \
            -e UPSTREAM_REPO \
            -v "$GITHUB_WORKSPACE:/workspace${{ matrix.workspace_mount }}" \
            -w /workspace \
            registry.fedoraproject.org/fedora:44 \
            bash -euo pipefail -c '
              dnf install -y -q python3 7zip curl unzip rpm-build rpm make gcc-c++ git nodejs npm gawk hostname dpkg

              git clone --depth 1 "$UPSTREAM_REPO" /tmp/src
              cd /tmp/src
              # Native SQLite and PTY rebuilds are memory-intensive. Keep node-gyp,
              # Electron rebuild, and RPM compression single-threaded on the shared
              # self-hosted runner so either architecture remains within its budget.
              MAX_BUILD_THREADS=1 PACKAGE_WITH_UPDATER=0 make build-app
              MAX_BUILD_THREADS=1 PACKAGE_WITH_UPDATER=0 make rpm
              rm -rf /workspace/artifacts/${{ matrix.rpm_arch }}
              mkdir -p /workspace/artifacts/${{ matrix.rpm_arch }}
              cp dist/*.rpm /workspace/artifacts/${{ matrix.rpm_arch }}/
            '
      - name: Upload ${{ matrix.rpm_arch }} RPM
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.rpm_arch }}
          path: artifacts/${{ matrix.rpm_arch }}/*.rpm
          if-no-files-found: error

  release:
    needs: [check, build]
    if: needs.check.outputs.changed == 'true' && inputs.validate_only != true
    runs-on: [self-hosted, linux, x64, codex-desktop]
    steps:
      # Self-hosted runner workspaces persist between jobs/runs. Never let old
      # RPMs become accidental release assets.
      - name: Clear prior artifact workspace
        run: rm -rf artifacts
      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release and prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT: ${{ needs.check.outputs.fingerprint }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          rpm_files=(artifacts/*/*.rpm)
          ((${#rpm_files[@]})) || { echo "No RPM artifacts downloaded" >&2; exit 1; }
          version="$(rpm -qp --qf '%{VERSION}' "${rpm_files[0]}")"
          gh release create "v$version" "${rpm_files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Codex Desktop $version" \
            --notes "Automated rebuild of upstream Codex.dmg via ilysenko/codex-desktop-linux.

          fingerprint: $FINGERPRINT"

          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | tail -n +4 \
            | while read -r tag; do
                echo "pruning $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              done

  # GitHub disables cron workflows after 60 days without repo activity.
  # Push an empty commit when the branch has been quiet for >25 days.
  keepalive:
    needs: check
    runs-on: [self-hosted, linux, x64, codex-desktop]
    steps:
      - uses: actions/checkout@v4
      - name: Keepalive commit if branch is stale
        run: |
          set -euo pipefail
          last="$(git log -1 --format=%ct)"
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "last commit ${age_days}d ago"
          if [ "$age_days" -ge 25 ]; then
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git commit --allow-empty -m "keepalive: prevent scheduled workflow expiry"
            git push
          fi
