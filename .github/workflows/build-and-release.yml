name: Build and Release

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: build-and-release
  cancel-in-progress: false

env:
  DMG_URL: https://persistent.oaistatic.com/codex-app-prod/Codex.dmg
  UPSTREAM_REPO: https://github.com/ilysenko/codex-desktop-linux.git

jobs:
  # Cheap gate: plain runner, ~30s. The expensive Fedora container builds only
  # run when the upstream DMG fingerprint differs from the latest release.
  check:
    runs-on: [self-hosted, linux, x64, codex-desktop]
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      fingerprint: ${{ steps.compare.outputs.fingerprint }}
      architectures: ${{ steps.runners.outputs.architectures }}
    steps:
      - name: Fingerprint upstream DMG and compare with latest release
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fp="$(curl -fsSLI --max-time 30 "$DMG_URL" \
            | awk 'tolower($0) ~ /^(etag|last-modified|content-length):/ {sub(/\r$/,""); print tolower($0)}' \
            | sort | sha256sum | cut -d' ' -f1)"
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"

          last_fp="$(gh release view --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null \
            | grep -oE 'fingerprint: [0-9a-f]{64}' | awk '{print $2}' || true)"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$last_fp" != "$fp" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream changed (or manual run): building. fp=$fp last=$last_fp"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream unchanged (fp=$fp)"
          fi

      # Keep the x64-only setup working today, and automatically add aarch64
      # once a native ARM runner with the project label is registered.
      - name: Select available native build architectures
        id: runners
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          architectures='[{"runner_arch":"x64","rpm_arch":"x86_64","container_arch":"amd64"}]'
          if gh api \
            "/repos/$GITHUB_REPOSITORY/actions/runners" \
            --jq '.runners[] | select(.status == "online" and (.labels | map(.name | ascii_downcase) | index("codex-desktop")) and (.labels | map(.name | ascii_downcase) | index("arm64"))) | .name' \
            | grep -q .; then
            architectures='[{"runner_arch":"x64","rpm_arch":"x86_64","container_arch":"amd64"},{"runner_arch":"arm64","rpm_arch":"aarch64","container_arch":"arm64"}]'
          fi
          echo "architectures=$architectures" >> "$GITHUB_OUTPUT"
          echo "Selected architectures: $architectures"

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.architectures) }}
    runs-on: [self-hosted, linux, "${{ matrix.runner_arch }}", codex-desktop]
    timeout-minutes: 90
    steps:
      # GitHub's job-level `container:` support requires Docker API semantics.
      # This runner uses rootless Podman, so run the Fedora build container directly.
      - name: Build RPM in Fedora container
        run: |
          set -euo pipefail
          podman run --rm --arch "${{ matrix.container_arch }}" \
            -e HOME=/tmp \
            -e UPSTREAM_REPO \
            -v "$GITHUB_WORKSPACE:/workspace:Z" \
            -w /workspace \
            registry.fedoraproject.org/fedora:44 \
            bash -euo pipefail -c '
              dnf install -y -q python3 7zip curl unzip rpm-build rpm make gcc-c++ git nodejs npm gawk hostname

              git clone --depth 1 "$UPSTREAM_REPO" /tmp/src
              cd /tmp/src
              PACKAGE_WITH_UPDATER=0 make build-app
              PACKAGE_WITH_UPDATER=0 make rpm
              mkdir -p /workspace/artifacts/${{ matrix.rpm_arch }}
              cp dist/*.rpm /workspace/artifacts/${{ matrix.rpm_arch }}/
            '
      - name: Upload ${{ matrix.rpm_arch }} RPM
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.rpm_arch }}
          path: artifacts/${{ matrix.rpm_arch }}/*.rpm
          if-no-files-found: error

  release:
    needs: [check, build]
    if: needs.check.outputs.changed == 'true'
    runs-on: [self-hosted, linux, x64, codex-desktop]
    steps:
      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release and prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT: ${{ needs.check.outputs.fingerprint }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          rpm_files=(artifacts/*/*.rpm)
          ((${#rpm_files[@]})) || { echo "No RPM artifacts downloaded" >&2; exit 1; }
          version="$(rpm -qp --qf '%{VERSION}' "${rpm_files[0]}")"
          gh release create "v$version" "${rpm_files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Codex Desktop $version" \
            --notes "Automated rebuild of upstream Codex.dmg via ilysenko/codex-desktop-linux.

          fingerprint: $FINGERPRINT"

          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | tail -n +4 \
            | while read -r tag; do
                echo "pruning $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              done

  # GitHub disables cron workflows after 60 days without repo activity.
  # Push an empty commit when the branch has been quiet for >25 days.
  keepalive:
    needs: check
    runs-on: [self-hosted, linux, x64, codex-desktop]
    steps:
      - uses: actions/checkout@v4
      - name: Keepalive commit if branch is stale
        run: |
          set -euo pipefail
          last="$(git log -1 --format=%ct)"
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "last commit ${age_days}d ago"
          if [ "$age_days" -ge 25 ]; then
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git commit --allow-empty -m "keepalive: prevent scheduled workflow expiry"
            git push
          fi
